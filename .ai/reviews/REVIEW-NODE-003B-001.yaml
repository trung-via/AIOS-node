findings:
  - id: F1
    basis: AC4
    action: CODE_FIX
    location: deploy/termux/bootstrap/start-services.sh
    issue: >
      The bootstrap assigns PREFIX, HOME, SVDIR, and LOGDIR as shell variables but does not
      export the service environment before exec'ing service-daemon. service-daemon is a new
      process and reads PREFIX and SVDIR from its process environment; in particular SVDIR is
      not guaranteed to be inherited from a Termux app-shell invocation. The current static test
      only checks assignment text, so it can pass while service-daemon receives no SVDIR and
      fails to supervise $PREFIX/var/service after cold boot.
    expected: >
      Export the deterministic Termux service environment before invoking service-daemon
      (at minimum PREFIX, SVDIR, and LOGDIR; preserve HOME as needed), and strengthen the
      standard-library static contract test so a future non-exported environment regression
      fails. Keep the bootstrap one-shot and preserve all existing NODE-003B authority bounds.
