name: Build Android Cold-Boot Bootstrap

on:
  push:
    paths:
      - 'android/boot-bootstrap/**'
      - '.github/workflows/build-android-bootstrap.yml'
  pull_request:
    paths:
      - 'android/boot-bootstrap/**'
      - '.github/workflows/build-android-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Qualification Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        working-directory: android/boot-bootstrap
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload qualification debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aios-boot-bootstrap-debug-apk
          path: android/boot-bootstrap/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
