[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aios-node"
version = "0.1.0"
description = "Portable operational host for AIOS-renew"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aios-node = "aios_node.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
