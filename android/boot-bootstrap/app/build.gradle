plugins {
    id 'com.android.application'
}

android {
    namespace 'io.aios.node.bootstrap'
    compileSdk 34

    defaultConfig {
        applicationId 'io.aios.node.bootstrap'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ''
        }
    }
}

dependencies {
    // Platform Android APIs only; no AndroidX or external runtime libraries.
}
